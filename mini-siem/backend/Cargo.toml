[package]
name = "mini-siem"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.5"
actix-rt = "2.9"
actix-cors = "0.6"
actix-ws = "0.2"

# async trait support
async-trait = "0.1"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "migrate"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"

# OpenTelemetry tracing
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
opentelemetry_otlp = { package = "opentelemetry-otlp", version = "0.31", features = ["trace", "grpc-tonic"] }

# Configuration
config = "0.13"
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID
uuid = { version = "1.5", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Environment
lazy_static = "1.4"

# Kafka client (librdkafka-based)
rdkafka = { version = "0.30", features = ["tokio"] }

# JWT support
jsonwebtoken = "8"

# Authentication
argon2 = "0.5"
rand = "0.8"
base64 = "0.21"
hmac = "0.12"
sha2 = "0.10"
futures-util = "0.3"

tokio-stream = "0.1"
arc-swap = "1.6"

# In-memory L1 cache for hot-path Redis reads
dashmap = "5.4"

# faster hashmap for hot paths
rustc-hash = "1.1"

# metrics and monitoring
prometheus = { version = "0.13", features = ["process"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"

# SmallVec for stack-allocated small collections (hot path)
smallvec = "1.15"

# OpenAPI generation
utoipa = "4.0"
utoipa-swagger-ui = "4.0"
regex = "1.10"
aho-corasick = "1.1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

